<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riveter</title>
    <link rel="icon" type="image/png" href="/static/img/copilot.png">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
    <style>
        * { font-family: 'Segoe UI', -apple-system, system-ui, sans-serif; }
    </style>
    <script>
        (function() {
            var saved = Number(localStorage.getItem('todoness-list-width'));
            if (!Number.isFinite(saved) || !saved) return;
            var width = Math.min(600, Math.max(260, saved));
            if (window.innerWidth > 768) {
                width = Math.min(width, Math.max(260, window.innerWidth - 409));
            }
            document.documentElement.style.setProperty('--left-panel-width', width + 'px');
        })();
    </script>
</head>
<body>
    {% block content %}{% end %}
    <script src="/static/js/markdown-utils.js"></script>
    <script src="/static/js/dashboard.js?v={{ asset_version }}"></script>
</body>
</html>
