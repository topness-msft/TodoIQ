[pytest]
testpaths = tests

# The Playwright e2e suite leaves a running asyncio event loop in the pytest
# process (the sync API drives one via greenlets on the main thread). Because
# pytest collects the tests/e2e/ directory *before* the sibling tests/test_*.py
# files, every Tornado AsyncHTTPTestCase that ran after it died with
# "RuntimeError: Cannot run the event loop while another loop is running" —
# 22 failures + 22 errors that all passed when run on their own.
#
# So e2e is deselected by default and run explicitly:
#     pytest                  -> unit tests only
#     pytest -m e2e           -> browser tests only
addopts = -m "not e2e"

markers =
    e2e: browser end-to-end test (Playwright); deselected by default, run with -m e2e
